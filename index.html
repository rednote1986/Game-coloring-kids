<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fun Color Quiz Kids</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <h1 id="question">What color is the apple?</h1>

  <img id="objectImg" src="assets/images/apple_bw.png" alt="Color Object">

  <div class="colors">
    <button onclick="chooseColor('red')">Red</button>
    <button onclick="chooseColor('yellow')">Yellow</button>
    <button onclick="chooseColor('blue')">Blue</button>
  </div>

  <p id="message"></p>

  <button id="nextBtn" onclick="nextLevel()">Next 👉</button>
</div>

<script src="script.js"></script>
</body>
</html>
